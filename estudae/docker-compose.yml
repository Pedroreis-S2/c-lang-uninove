services:
  # --------------------------------------------------------------------------
  # dev - DESENVOLVIMENTO (Codespaces / dev container)
  # Dia a dia NAO precisa rebuildar imagem: o codigo e montado por volume e o
  # scripts/dev.sh observa os arquivos e atualiza o navegador automaticamente.
  #   docker compose up -d dev
  #   -> http://localhost:5000
  # Testes:
  #   docker compose exec dev flutter test
  # --------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: estudae-dev:latest
    container_name: estudae-dev
    working_dir: /workspaces/estudae
    volumes:
      - .:/workspaces/estudae
      # Pacotes do pub ficam num volume: `flutter pub get` fica instantaneo
      # depois da primeira vez, mesmo recriando o container.
      - pub-cache:/root/.pub-cache
    command: sh scripts/dev.sh
    init: true
    ports:
      - "5000:5000"

  # --------------------------------------------------------------------------
  # web - PRODUCAO / APRESENTACAO
  # Build web do Flutter servido por nginx.
  #   docker compose up --build web   ->  http://localhost:8080
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: estudae-web:latest
    container_name: estudae-web
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pub-cache:
