# Proxy reverso do UninoVet: uma porta so (3000) para tudo.
#   /          -> app do cliente (Flutter)
#   /api/...   -> API JSON (aplicacao Java da clinica)
#   /clinica/  -> aplicacao da clinica: login, painel, agenda, solicitacoes
#   /clinica/admin -> modulo admin (JSP) dentro da aplicacao da clinica
#
# Como e tudo na mesma origem, o app chama /api sem CORS e funciona igual no
# local e no Codespace (onde cada porta vira um endereco diferente).
server {
    listen 80;
    server_name _;

    # Redirecionamentos so com caminho: atras do HTTPS do Codespace o nginx
    # nao sabe o endereco publico e montaria um http:// errado.
    absolute_redirect off;

    # Documentos de ate 5 MB (receitas, laudos).
    client_max_body_size 6m;

    # API consumida pelo app.
    location /api/ {
        proxy_pass http://web:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Aplicacao da clinica. O prefixo avisa o Java para montar links /clinica/...
    location = /clinica { return 301 /clinica/; }
    location /clinica/ {
        proxy_pass http://web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /clinica;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Endereco antigo do painel.
    location = /admin { return 301 /clinica/admin; }
    location /admin/ { return 301 /clinica/admin; }

    # Aplicativo Flutter (dev server) no restante, com suporte a websocket.
    location / {
        proxy_pass http://mobile:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
