# UninoVet - sobe tudo com um comando: docker compose up
#
#   db     -> MySQL com as tabelas e os dados ja criados (db/init.sql)
#   web    -> painel do veterinario em Java (JSP/Servlet) + API dos agendamentos
#   mobile -> aplicativo Flutter (foco do projeto)
#   proxy  -> (opcional, --profile proxy) junta tudo numa porta so
#
# Sao duas aplicacoes separadas: painel Java em http://localhost:8080 e
# aplicativo Flutter em http://localhost:5000 (banco em 3306).
# O app tem hot reload automatico: salvou um arquivo em mobile/lib, o navegador
# atualiza sozinho (scripts/dev.py observa os arquivos).
# O Flutter descobre o Java pela variavel API_BASE (o Makefile preenche).

services:
  db:
    image: mysql:8.0
    container_name: uninovet-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uninovet
      MYSQL_USER: uninovet
      MYSQL_PASSWORD: uninovet
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: uninovet-web
    environment:
      DB_HOST: db
      DB_NAME: uninovet
      DB_USER: uninovet
      DB_PASSWORD: uninovet
      # Endereco do app Flutter (o painel mostra um link para ele).
      APP_URL: ${APP_URL:-http://localhost:5000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile.dev
    image: uninovet-mobile-dev:latest
    container_name: uninovet-mobile
    working_dir: /app
    volumes:
      - ./mobile:/app
      - mobile-pub-cache:/root/.pub-cache
    environment:
      # Endereco do Java, passado por argumento ao Flutter (--dart-define).
      API_BASE: ${API_BASE:-}
    command: sh scripts/dev.sh
    init: true
    ports:
      - "5000:5000"
    depends_on:
      - web

  # Opcional: junta tudo numa porta so. Subir com: docker compose --profile proxy up
  proxy:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: uninovet-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - web
      - mobile

volumes:
  mobile-pub-cache:
